<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para Ti</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(rgba(5, 2, 10, 0.75), rgba(5, 2, 10, 0.75)), url('foto.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      color: #fff;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .galaxy-container {
      position: absolute;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .heart-center {
      position: absolute;
      width: 140px;
      height: 140px;
      cursor: pointer;
      pointer-events: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 20px rgba(255, 223, 0, 0.9));
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .flower-item {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s;
    }

    .flower-item:active {
      transform: scale(1.2) !important;
    }

    .flower-img {
      font-size: 2.2rem;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.9));
    }

    .flower-text {
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff3a1;
      text-shadow: 0 0 6px #ffaa00;
      white-space: nowrap;
      margin-top: 4px;
      background: rgba(0, 0, 0, 0.65);
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 223, 0, 0.4);
    }

    /* Modal / Carta */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .letter-card {
      background: linear-gradient(135deg, #fceabb 0%, #f8b500 100%);
      color: #332200;
      width: 85%;
      max-width: 350px;
      padding: 28px 22px;
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.7);
      text-align: center;
      transform: translateY(20px);
      transition: transform 0.4s ease;
    }

    .modal.active .letter-card {
      transform: translateY(0);
    }

    .letter-card h1 {
      font-family: 'Caveat', cursive;
      font-size: 2.8rem;
      margin-bottom: 12px;
      color: #4a3000;
    }

    .letter-card p {
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 18px;
      color: #332200;
    }

    .btn-close {
      background: #4a3000;
      color: #fff3a1;
      border: none;
      padding: 10px 26px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>

  <canvas id="starsCanvas"></canvas>

  <div class="galaxy-container">
    <div class="heart-center" id="heartCenter">
      <svg width="120" height="120" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#yellowGlow)" />
        <defs>
          <radialGradient id="yellowGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(12 12) rotate(90) scale(12)">
            <stop stop-color="#ffff80" />
            <stop offset="0.6" stop-color="#ffcc00" />
            <stop offset="1" stop-color="#ff9900" />
          </radialGradient>
        </defs>
      </svg>
    </div>

    <div id="orbitContainer" style="position: absolute; width: 100%; height: 100%; pointer-events: none;"></div>
  </div>

  <!-- Modal / Carta -->
  <div class="modal" id="letterModal">
    <div class="letter-card">
      <h1 id="modalTitle">Mi niña</h1>
      <p id="modalBody">Mensaje especial...</p>
      <h2 style="font-family: 'Caveat', cursive; font-size: 2.2rem; margin-bottom: 18px; color: #4a3000;">Te Amo</h2>
      <button class="btn-close" id="btnClose">Cerrar</button>
    </div>
  </div>

  <script>
    // Canvas Espiral / Galaxia Background
    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const particleCount = 650;

    for (let i = 0; i < particleCount; i++) {
      particles.push({
        radius: Math.random() * Math.min(width, height) * 0.45,
        angle: Math.random() * Math.PI * 2,
        speed: 0.001 + Math.random() * 0.002,
        size: Math.random() * 2.2 + 0.5,
        color: ['#ffffff', '#ffe600', '#ffc400', '#ff9100'][Math.floor(Math.random() * 4)]
      });
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2;

      particles.forEach(p => {
        p.angle += p.speed;
        const x = cx + Math.cos(p.angle) * p.radius;
        const y = cy + Math.sin(p.angle) * (p.radius * 0.5);

        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.fill();
      });

      requestAnimationFrame(animate);
    }
    animate();

    // Datos de cada botón y su carta única
    const itemsData = [
      { text: 'Te Amo', icon: '🌻', title: 'Para ti', body: 'Estas flores amarillas son un detalle sencillo para recordarte lo especial e increíble que eres en mi vida.' },
      { text: 'Eres mi sol', icon: '💐', title: 'Mi sol', body: 'Con solo una sonrisa tuya logras iluminar mi día entero. Gracias por existir y darme tanta alegría.' },
      { text: 'Mi niña', icon: '🌻', title: 'Mi niña', body: 'Amo cada momento a tu lado. Tu ternura, tu forma de ser y todo de ti me enamora un poco más cada día.' },
      { text: 'Me encantas', icon: '🌻', title: 'Me encantas', body: 'Me encantas en todos los sentidos posibles. No hay nadie en este mundo con quien prefiera estar que contigo.' },
      { text: 'Eres preciosa', icon: '💐', title: 'Eres preciosa', body: 'Tanto por fuera como por dentro, eres la persona más hermosa que he conocido. Simplemente perfecta.' },
      { text: 'Siempre juntos', icon: '🌻', title: 'Siempre juntos', body: 'Quiero estar a tu lado apoyándote y haciéndote feliz en cada paso que des. Eres mi lugar favorito.' },
      { text: 'Eres única', icon: '🌻', title: 'Eres única', body: 'No existen palabras suficientes para describir lo mucho que vales. No hay nadie como tú.' },
      { text: 'Mi Prioridad', icon: '💐', title: 'Mi Prioridad', body: 'Siempre serás mi prioridad y mi pensamiento favorito. Llegaste a mi vida a cambiarlo todo para bien.' }
    ];

    const heartData = {
      title: 'Mi niña hermosa',
      body: 'Estas flores amarillas son como tú: brillantes, radiantes y llenas de vida. Gracias por llenar mi mundo de tanta felicidad.'
    };

    const orbitContainer = document.getElementById('orbitContainer');
    const modal = document.getElementById('letterModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const btnClose = document.getElementById('btnClose');

    function openModal(title, body) {
      modalTitle.textContent = title;
      modalBody.textContent = body;
      modal.classList.add('active');
    }

    const flowerElements = [];

    itemsData.forEach((data, index) => {
      const el = document.createElement('div');
      el.className = 'flower-item';
      el.innerHTML = `<span class="flower-img">${data.icon}</span><span class="flower-text">${data.text}</span>`;
      orbitContainer.appendChild(el);
      
      flowerElements.push({
        element: el,
        angle: (index / itemsData.length) * Math.PI * 2,
        speed: 0.003
      });

      el.addEventListener('click', () => {
        openModal(data.title, data.body);
      });
    });

    function updateOrbit() {
      const cx = width / 2;
      const cy = height / 2;

      flowerElements.forEach(item => {
        item.angle += item.speed;
        const x = cx + Math.cos(item.angle) * (Math.min(width, height) * 0.38) - 40;
        const y = cy + Math.sin(item.angle) * (Math.min(width, height) * 0.22) - 30;

        item.element.style.left = `${x}px`;
        item.element.style.top = `${y}px`;
      });

      requestAnimationFrame(updateOrbit);
    }
    updateOrbit();

    // Evento del Corazón
    document.getElementById('heartCenter').addEventListener('click', () => {
      openModal(heartData.title, heartData.body);
    });

    btnClose.addEventListener('click', () => {
      modal.classList.remove('active');
    });
  </script>
</body>
</html>
